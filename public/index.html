<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>개인 시크릿 보관함</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 이동</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="작업 공간">
        <div class="brand"><span class="brand-mark" aria-hidden="true">P</span><div><strong>개인 시크릿 보관함</strong><small>Personal Secret Manager</small></div></div>
        <div class="workspace-picker">
          <label for="project-select">프로젝트</label>
          <select id="project-select" disabled><option value="">불러오는 중</option></select>
          <label for="environment-select">환경</label>
          <select id="environment-select" disabled><option value="">프로젝트를 선택하세요</option></select>
          <button id="manage-workspace" class="quiet">프로젝트·환경 관리</button>
        </div>
        <nav class="view-nav" aria-label="관리 메뉴">
          <button data-view="secrets" aria-current="page">시크릿</button>
          <button data-view="trash">휴지통</button>
          <button data-view="policies">CI 정책</button>
          <button data-view="audit">감사 기록</button>
          <button data-view="backup">백업·복구</button>
        </nav>
        <p class="sidebar-note">원문은 보기·복사·다운로드를 요청할 때 불러옵니다.</p>
      </aside>
      <main id="main" class="main-content" tabindex="-1">
        <header class="page-heading"><div><p id="context-label" class="eyebrow">나의 작업 공간</p><h1 id="view-title">시크릿</h1><p id="view-description" class="muted">프로젝트에서 사용할 환경변수와 파일을 관리하세요.</p></div></header>
        <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true">작업 공간을 불러오는 중입니다.</p>
        <section id="view" aria-labelledby="view-title"></section>
        <noscript><p class="notice">이 관리 화면을 사용하려면 JavaScript를 활성화하세요.</p></noscript>
      </main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  </body>
</html>
