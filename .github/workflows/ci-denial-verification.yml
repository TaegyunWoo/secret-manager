name: Rollout CI rejection verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  assert-denied:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'verify/rollout-ci-denials'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assert authenticated request is forbidden
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { githubToken } from './dist/cli/client.js';
          const origin = 'https://psm-ci.dnxprbs.workers.dev';
          const token = await githubToken(origin);
          const response = await fetch(origin + '/v1/resolve', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'content-type': 'application/json' },
            body: JSON.stringify({ project: 'my-app', environment: 'ci', names: ['API_TOKEN', 'SIGNING_KEY'] }),
            redirect: 'error',
          });
          assert.equal(response.status, 403);
          assert.equal((await response.json()).error.code, 'forbidden');
          console.log('Signed GitHub OIDC request was rejected with HTTP 403.');
          NODE
